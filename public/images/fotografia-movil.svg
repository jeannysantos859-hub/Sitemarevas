<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="photo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2F5E4E"/>
      <stop offset="60%" stopColor="#1E3E33"/>
      <stop offset="100%" stopColor="#0B261F"/>
    </linearGradient>
    <linearGradient id="lens-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8"/>
      <stop offset="40%" stopColor="#0284C7"/>
      <stop offset="80%" stopColor="#0369A1"/>
      <stop offset="100%" stopColor="#082F49"/>
    </linearGradient>
    <filter id="photo-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#photo-bg)"/>

  <!-- Golden hour warm glow on side -->
  <circle cx="700" cy="150" r="220" fill="#FBBF24" opacity="0.12" filter="url(#photo-glow)"/>

  <!-- Macro Camera Lens Mockup -->
  <g transform="translate(400, 310)">
    <!-- Lens outer chassis rings -->
    <circle cx="0" cy="0" r="160" fill="#0F172A" stroke="#475569" stroke-width="8"/>
    <circle cx="0" cy="0" r="142" fill="#1E293B" stroke="#64748B" stroke-width="4"/>
    <circle cx="0" cy="0" r="126" fill="#090D16"/>

    <!-- Lens Aperture ring text -->
    <path id="textPath" d="M -90,0 A 90,90 0 1,1 90,0" fill="none"/>
    <text font-family="monospace" font-size="11" fill="#94A3B8" letter-spacing="2">
      <textPath href="#textPath" startOffset="10%">MAREVAS OPTICS · F/1.8 24MM MACRO 4K</textPath>
    </text>

    <!-- Glass Element with antireflective violet/cyan coating -->
    <circle cx="0" cy="0" r="92" fill="url(#lens-glass)"/>
    <!-- Glass reflection crescents -->
    <path d="M-60 -50 C -30 -80, 40 -80, 60 -50 C 40 -65, -30 -65, -60 -50 Z" fill="#FFFFFF" opacity="0.4"/>
    <path d="M-40 40 C -10 65, 40 65, 60 40 C 40 52, -10 52, -40 40 Z" fill="#38BDF8" opacity="0.5"/>

    <!-- Aperture Blades -->
    <polygon points="0,-35 30,-15 30,20 0,35 -30,20 -30,-15" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="0" r="14" fill="#0284C7" opacity="0.8"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(60, 50)">
    <rect width="280" height="74" rx="14" fill="#0B261F" stroke="#DCE5E0" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="24" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#DCE5E0" letter-spacing="3">FOTOGRAFÍA MÓVIL</text>
    <text x="24" y="58" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Producto & Espacios</text>
  </g>
</svg>
