<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="100%" height="100%">
  <defs>
    <linearGradient id="bottero-reel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E1916"/>
      <stop offset="45%" stopColor="#382C24"/>
      <stop offset="80%" stopColor="#241B15"/>
      <stop offset="100%" stopColor="#0F0C0A"/>
    </linearGradient>
    <linearGradient id="warm-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#D97706"/>
      <stop offset="100%" stopColor="#92400E"/>
    </linearGradient>
    <filter id="store-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Store Ambiance -->
  <rect width="720" height="1280" fill="url(#bottero-reel-bg)"/>

  <!-- Warm spotlight from store ceiling -->
  <path d="M260 0 L460 0 L600 700 L120 700 Z" fill="#FDE68A" opacity="0.08"/>
  <ellipse cx="360" cy="720" rx="280" ry="80" fill="#F59E0B" opacity="0.12"/>

  <!-- Store Display Shelf / Pedestal -->
  <g transform="translate(360, 520)">
    <rect x="-240" y="80" width="480" height="24" rx="8" fill="#524338"/>
    <ellipse cx="0" cy="80" rx="240" ry="24" fill="#6B5749"/>

    <!-- Pair of Boots / Sandalias Bottero in showcase -->
    <path d="M-110 50 C -110 -20, -70 -70, -20 -40 C 0 -25, 10 10, -10 60 Z" fill="#B45309" filter="url(#store-glow)"/>
    <path d="M40 50 C 40 -10, 80 -60, 130 -30 C 150 -15, 160 20, 140 60 Z" fill="#D97706"/>
  </g>

  <!-- Big Neon Store Sign Simulation -->
  <g transform="translate(360, 260)" filter="url(#store-glow)">
    <rect x="-180" y="-36" width="360" height="72" rx="14" fill="#064E3B" stroke="#DCE5E0" stroke-width="2"/>
    <text x="0" y="8" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">BOTTERO</text>
    <text x="0" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#DCE5E0" text-anchor="middle" letter-spacing="2">PASSEIO DAS ÁGUAS</text>
  </g>

  <!-- Play Circle Center Overlay -->
  <g transform="translate(360, 640)" filter="url(#store-glow)">
    <circle cx="0" cy="0" r="64" fill="#D97706" fill-opacity="0.9" stroke="#FFFFFF" stroke-width="3"/>
    <polygon points="-12,-24 24,0 -12,24" fill="#FFFFFF"/>
  </g>

  <!-- Top Reel UI overlay -->
  <rect x="0" y="0" width="720" height="180" fill="black" opacity="0.4"/>
  <g transform="translate(48, 64)">
    <rect width="210" height="42" rx="21" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.2)"/>
    <circle cx="21" cy="21" r="7" fill="#F59E0B"/>
    <text x="42" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">REELS 9:16</text>
  </g>

  <!-- Campaign Text -->
  <g transform="translate(48, 980)">
    <rect width="180" height="38" rx="8" fill="#B45309" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="90" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">BOTTERO</text>

    <text x="0" y="80" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">Coleção Primavera-Verão</text>
    <text x="0" y="120" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#FDE68A">Cuero Legítimo & Moda en Tienda</text>
    <text x="0" y="156" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#D1D5DB">Grabación in situ, ritmo visual y dinamización comercial</text>
  </g>

  <!-- Bottom Sound -->
  <g transform="translate(48, 1190)">
    <rect width="320" height="36" rx="18" fill="rgba(0,0,0,0.6)"/>
    <text x="24" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF">🎵 Tendencia TikTok & Reels · Bottero</text>
  </g>
</svg>
