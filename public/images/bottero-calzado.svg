<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bottero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#EDE8E1"/>
      <stop offset="60%" stopColor="#DFD7CB"/>
      <stop offset="100%" stopColor="#C9BFA8"/>
    </linearGradient>
    <linearGradient id="leather-tan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#B37D4E"/>
      <stop offset="45%" stopColor="#8C582B"/>
      <stop offset="85%" stopColor="#6E3E17"/>
      <stop offset="100%" stopColor="#4A280D"/>
    </linearGradient>
    <linearGradient id="leather-light" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stopColor="#C89668"/>
      <stop offset="100%" stopColor="#9C6235"/>
    </linearGradient>
    <linearGradient id="podium-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="100%" stopColor="#E5E0D5"/>
    </linearGradient>
    <linearGradient id="gold-buckle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFE082"/>
      <stop offset="50%" stopColor="#FFB300"/>
      <stop offset="100%" stopColor="#B27B00"/>
    </linearGradient>
    <filter id="leather-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#4A280D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Editorial Warm Studio Background -->
  <rect width="800" height="600" fill="url(#bottero-bg)"/>

  <!-- Minimal Architectural Arches & Shadows -->
  <path d="M500 0 C650 150, 750 350, 750 600 L800 600 L800 0 Z" fill="#D3C9BC" opacity="0.4"/>
  <ellipse cx="400" cy="510" rx="320" ry="60" fill="#9C907C" opacity="0.35"/>

  <!-- Cylindrical Curved Pedestal -->
  <g transform="translate(400, 430)">
    <path d="M-240 40 L-240 100 C-240 145, 240 145, 240 100 L240 40 Z" fill="#D0C6B8"/>
    <ellipse cx="0" cy="40" rx="240" ry="50" fill="url(#podium-surface)"/>
    <ellipse cx="0" cy="40" rx="225" ry="44" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- Genuine Leather Heeled Sandal / Calzado Bottero -->
  <g transform="translate(400, 310)" filter="url(#leather-shadow)">
    <!-- Block Heel (Tacón Bloque Geométrico) -->
    <path d="M-130 90 L-85 90 L-95 180 L-145 180 Z" fill="url(#leather-tan)"/>
    <path d="M-145 174 L-95 174 L-95 180 L-145 180 Z" fill="#2B1608"/> <!-- Heel tip -->

    <!-- Arch & Sole Base -->
    <path d="M-140 90 C -60 90, 40 135, 140 145 C 170 148, 180 140, 160 130 C 60 115, -40 75, -130 75 Z" fill="#2B1608"/>
    <path d="M-135 84 C -55 84, 45 128, 145 138 C 160 140, 165 135, 150 126 C 55 110, -35 70, -125 70 Z" fill="url(#leather-light)"/>

    <!-- Front Leather Cross Straps -->
    <path d="M40 125 C 70 85, 120 75, 155 115 C 145 125, 95 135, 40 125 Z" fill="url(#leather-tan)"/>
    <path d="M50 122 C 78 88, 115 80, 148 114" fill="none" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="3 3"/> <!-- Stitches -->

    <path d="M70 128 C 95 90, 140 85, 175 120 C 165 130, 120 138, 70 128 Z" fill="url(#leather-light)"/>

    <!-- Ankle Strap with Gold Buckle -->
    <path d="M-110 80 C -120 10, -70 -20, -20 -10 C 20 -2, 40 40, 15 90" fill="none" stroke="url(#leather-tan)" stroke-width="20" stroke-linecap="round"/>
    <path d="M-110 80 C -120 10, -70 -20, -20 -10 C 20 -2, 40 40, 15 90" fill="none" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Gold Buckle -->
    <g transform="translate(-18, -12)">
      <rect x="-12" y="-14" width="24" height="28" rx="5" fill="none" stroke="url(#gold-buckle)" stroke-width="5"/>
      <line x1="-12" y1="0" x2="10" y2="0" stroke="url(#gold-buckle)" stroke-width="4"/>
    </g>

    <!-- Bottero Insole Embossed Brand Logo -->
    <text x="-90" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#6E3E17" letter-spacing="2">BOTTERO</text>
    <text x="-90" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="600" fill="#8C582B">COURO LEGÍTIMO</text>
  </g>

  <!-- Brand Typography Overlay Badge -->
  <g transform="translate(60, 50)">
    <rect width="280" height="74" rx="14" fill="#064E3B" stroke="#2F5E4E" stroke-width="1.5"/>
    <text x="24" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#DCE5E0" letter-spacing="3">FOTOGRAFÍA & CALZADO</text>
    <text x="24" y="58" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Bottero</text>
  </g>

  <g transform="translate(560, 50)">
    <rect width="180" height="42" rx="10" fill="#FFFFFF" stroke="#064E3B" stroke-width="1.5"/>
    <text x="90" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#064E3B" text-anchor="middle" letter-spacing="1">CUERO LEGÍTIMO</text>
  </g>
</svg>
