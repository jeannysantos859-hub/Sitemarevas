<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-velvet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#064E3B"/>
      <stop offset="60%" stopColor="#043226"/>
      <stop offset="100%" stopColor="#021C15"/>
    </linearGradient>
    <linearGradient id="podium-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#2F5E4E"/>
      <stop offset="100%" stopColor="#0A3F30"/>
    </linearGradient>
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="25%" stopColor="#E5E7EB"/>
      <stop offset="50%" stopColor="#9CA3AF"/>
      <stop offset="75%" stopColor="#F3F4F6"/>
      <stop offset="100%" stopColor="#6B7280"/>
    </linearGradient>
    <linearGradient id="silver-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="30%" stopColor="#D1D5DB"/>
      <stop offset="70%" stopColor="#FFFFFF"/>
      <stop offset="100%" stopColor="#9CA3AF"/>
    </linearGradient>
    <radialGradient id="ruby-grad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stopColor="#FF4D6D"/>
      <stop offset="50%" stopColor="#C9184A"/>
      <stop offset="85%" stopColor="#800F2F"/>
      <stop offset="100%" stopColor="#590D22"/>
    </radialGradient>
    <radialGradient id="gem-shine" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stopColor="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stopColor="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow-star" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Studio Surface -->
  <rect width="800" height="600" fill="url(#bg-velvet)"/>

  <!-- Velvet texture rings -->
  <ellipse cx="400" cy="460" rx="340" ry="90" fill="#032018" opacity="0.6"/>
  <ellipse cx="400" cy="440" rx="280" ry="70" fill="url(#podium-grad)" opacity="0.8" filter="url(#shadow-main)"/>
  <ellipse cx="400" cy="430" rx="260" ry="60" fill="#084C3A"/>

  <!-- Ambient light beam -->
  <path d="M220 0 L580 0 L520 600 L280 600 Z" fill="#FFFFFF" opacity="0.04"/>

  <!-- Silver Chain / Necklace curve -->
  <path d="M180 340 C 260 480, 540 480, 620 340" fill="none" stroke="url(#silver-grad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 8" filter="url(#shadow-main)"/>
  <path d="M190 330 C 270 470, 530 470, 610 330" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Main Luxury 925 Silver Ring with Ruby Centerpiece -->
  <g transform="translate(400, 310)" filter="url(#shadow-main)">
    <!-- Ring Band Back -->
    <ellipse cx="0" cy="40" rx="110" ry="50" fill="none" stroke="url(#silver-grad)" stroke-width="24"/>
    <ellipse cx="0" cy="40" rx="110" ry="50" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>

    <!-- Ring Crown / Prong Setting -->
    <path d="M-60 10 L-40 -40 L40 -40 L60 10 L40 30 L-40 30 Z" fill="url(#silver-rim)"/>
    <circle cx="-35" cy="-20" r="6" fill="#FFFFFF" filter="url(#glow-star)"/>
    <circle cx="35" cy="-20" r="6" fill="#FFFFFF" filter="url(#glow-star)"/>
    <circle cx="-50" cy="10" r="5" fill="#E5E7EB"/>
    <circle cx="50" cy="10" r="5" fill="#E5E7EB"/>

    <!-- Cushion-Cut Faceted Ruby Gemstone -->
    <polygon points="0,-75 55,-35 45,25 -45,25 -55,-35" fill="url(#ruby-grad)"/>
    <!-- Facet reflections -->
    <polygon points="0,-75 0,-15 55,-35" fill="#FF758F" opacity="0.4"/>
    <polygon points="0,-75 -55,-35 0,-15" fill="#A4133C" opacity="0.4"/>
    <polygon points="-45,25 0,-15 45,25" fill="#590D22" opacity="0.6"/>
    <polygon points="-25,-50 0,-65 25,-50 20,-30 -20,-30" fill="#FFFFFF" opacity="0.5"/>
    <ellipse cx="-15" cy="-45" rx="18" ry="8" fill="url(#gem-shine)" transform="rotate(-15 -15 -45)"/>

    <!-- Solitaire Prongs -->
    <rect x="-55" y="-55" width="8" height="22" rx="4" fill="url(#silver-grad)"/>
    <rect x="47" y="-55" width="8" height="22" rx="4" fill="url(#silver-grad)"/>
    <rect x="-42" y="15" width="8" height="18" rx="4" fill="url(#silver-grad)"/>
    <rect x="34" y="15" width="8" height="18" rx="4" fill="url(#silver-grad)"/>

    <!-- Ring Band Front Cut -->
    <path d="M-110 40 C -110 85, -50 105, 0 105 C 50 105, 110 85, 110 40" fill="none" stroke="url(#silver-grad)" stroke-width="24"/>
    <path d="M-105 40 C -105 80, -45 100, 0 100 C 45 100, 105 80, 105 40" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.75"/>
    <path d="M-90 52 C -45 92, 45 92, 90 52" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  </g>

  <!-- Accompanying Silver Earring Stud on the Left -->
  <g transform="translate(220, 390)" filter="url(#shadow-main)">
    <circle cx="0" cy="0" r="28" fill="url(#silver-grad)"/>
    <circle cx="0" cy="0" r="24" fill="url(#silver-rim)"/>
    <circle cx="0" cy="0" r="16" fill="url(#ruby-grad)"/>
    <circle cx="-5" cy="-6" r="6" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Sparkle Glints (Pratas brilliance) -->
  <g filter="url(#glow-star)" fill="#FFFFFF">
    <!-- Center glint -->
    <path d="M360 220 Q400 220 400 180 Q400 220 440 220 Q400 220 400 260 Q400 220 360 220 Z"/>
    <circle cx="400" cy="220" r="5" fill="#FFFFFF"/>

    <!-- Secondary glints -->
    <path d="M510 320 Q530 320 530 300 Q530 320 550 320 Q530 320 530 340 Q530 320 510 320 Z" transform="scale(0.7) translate(220, 80)"/>
    <path d="M220 360 Q235 360 235 345 Q235 360 250 360 Q235 360 235 375 Q235 360 220 360 Z" transform="scale(0.8) translate(40, 60)"/>
  </g>

  <!-- Brand Typography Overlay Badge -->
  <g transform="translate(60, 50)">
    <rect width="280" height="74" rx="14" fill="#000000" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
    <text x="24" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#DCE5E0" letter-spacing="3">FOTOGRAFÍA DE PRODUCTO</text>
    <text x="24" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">Bethânia Pratas</text>
  </g>

  <g transform="translate(560, 50)">
    <rect width="180" height="42" rx="10" fill="#064E3B" stroke="#DCE5E0" stroke-opacity="0.4" stroke-width="1"/>
    <text x="90" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PLATA 925 OFICIAL</text>
  </g>
</svg>
