<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="100%" height="100%">
  <defs>
    <linearGradient id="reel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#042F24"/>
      <stop offset="40%" stopColor="#064E3B"/>
      <stop offset="75%" stopColor="#1E3A2F"/>
      <stop offset="100%" stopColor="#021B14"/>
    </linearGradient>
    <linearGradient id="silver-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="35%" stopColor="#E5E7EB"/>
      <stop offset="65%" stopColor="#9CA3AF"/>
      <stop offset="100%" stopColor="#F9FAFB"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stopColor="#042F24" stop-opacity="0"/>
    </linearGradient>
    <filter id="reel-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="1280" fill="url(#reel-bg)"/>

  <!-- Aesthetic curves & depth -->
  <circle cx="360" cy="560" r="320" fill="url(#glow-grad)"/>
  <ellipse cx="360" cy="740" rx="300" ry="120" fill="#021711" opacity="0.6"/>

  <!-- Simulated Model Hand / Ring Display -->
  <g transform="translate(360, 580)">
    <!-- Silver Bracelet curve -->
    <path d="M-180 80 C -120 -40, 120 -40, 180 80" fill="none" stroke="url(#silver-metal)" stroke-width="14" stroke-linecap="round"/>
    <path d="M-175 75 C -115 -45, 115 -45, 175 75" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <!-- Central 925 Silver Pendant -->
    <circle cx="0" cy="20" r="46" fill="url(#silver-metal)" filter="url(#reel-glow)"/>
    <circle cx="0" cy="20" r="38" fill="#064E3B"/>
    <polygon points="0,-10 24,20 0,46 -24,20" fill="url(#silver-metal)"/>
    <circle cx="0" cy="20" r="8" fill="#FFFFFF"/>

    <!-- Sparkles -->
    <g fill="#FFFFFF" filter="url(#reel-glow)">
      <polygon points="120,-80 125,-60 145,-55 125,-50 120,-30 115,-50 95,-55 115,-60"/>
      <polygon points="-110,-120 -106,-105 -91,-101 -106,-97 -110,-82 -114,-97 -129,-101 -114,-105"/>
    </g>
  </g>

  <!-- Top Reel UI overlay -->
  <rect x="0" y="0" width="720" height="180" fill="black" opacity="0.4"/>
  <g transform="translate(48, 64)">
    <rect width="210" height="42" rx="21" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.2)"/>
    <circle cx="21" cy="21" r="7" fill="#10B981"/>
    <text x="42" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">REELS 9:16</text>
  </g>

  <!-- Play Circle Center Overlay -->
  <g transform="translate(360, 600)" filter="url(#reel-glow)">
    <circle cx="0" cy="0" r="64" fill="#064E3B" fill-opacity="0.85" stroke="#FFFFFF" stroke-width="3"/>
    <polygon points="-12,-24 24,0 -12,24" fill="#FFFFFF"/>
  </g>

  <!-- Campaign Text & Title in Portuguese as original -->
  <g transform="translate(48, 980)">
    <!-- Pill tag -->
    <rect width="240" height="38" rx="8" fill="#064E3B" stroke="#DCE5E0" stroke-width="1.5"/>
    <text x="120" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">BETHÂNIA PRATAS</text>

    <!-- Main Campaign Headline -->
    <text x="0" y="80" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">«A Copa já começou»</text>
    <text x="0" y="120" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#DCE5E0">Coleção Exclusiva Prata 925</text>
    <text x="0" y="156" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF">Producción audiovisual vertical para Instagram Reels</text>
  </g>

  <!-- Sound Badge at Bottom -->
  <g transform="translate(48, 1190)">
    <rect width="320" height="36" rx="18" fill="rgba(0,0,0,0.6)"/>
    <text x="24" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF">🎵 Áudio Original · Bethânia Pratas</text>
  </g>
</svg>
